<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Entrar · Me Encontre</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#111216;color:#f2f3f5;font:14px/1.6 'Segoe UI',system-ui,sans-serif;min-height:100dvh;display:grid;place-items:center;padding:24px}main{width:min(100%,400px)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:42px;font-weight:600}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:10px;background:#b7354d;font-size:20px}.brand small{display:block;color:#aeb4c2;font-size:11px;font-weight:400}h1{font-size:28px;letter-spacing:-.03em;margin:0 0 10px}p{color:#b1b5c1;margin:0 0 28px}form{padding:26px;background:#1a1c22;border:1px solid #32353e;border-radius:12px}label{display:block;font-size:12px;margin-bottom:8px;color:#c6cad4}input{width:100%;background:#14161b;color:white;border:1px solid #444853;border-radius:7px;font:16px inherit;padding:12px;margin-bottom:20px;height:46px;font-family:inherit}.password{position:relative}.password input{padding-right:76px}.toggle{position:absolute;right:8px;top:8px;background:transparent;color:#bec3ce;border:0;padding:7px;font-size:11px;cursor:pointer}.submit{width:100%;padding:13px;background:#b7354d;color:white;border:0;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}.submit:hover{background:#ca3e57}button:disabled{opacity:.6;cursor:wait}:focus-visible{outline:2px solid #ff8a9a;outline-offset:3px}.error{color:#ffadbc;font-size:13px;margin:0 0 16px}.error:empty{display:none}footer{font-size:11px;color:#9b9fac;text-align:center;margin-top:24px}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}</style></head><body><main><div class="brand"><span class="mark" aria-hidden="true">↗</span><div>Me Encontre<small>Painel de consultas</small></div></div><h1>Acesse seu espaço.</h1><p>Entre com suas credenciais para continuar.</p><form id="login"><label for="username">Usuário</label><input id="username" name="username" autocomplete="username" required maxlength="100"><label for="password">Senha</label><div class="password"><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256"><button type="button" class="toggle" id="toggle" aria-pressed="false">Mostrar</button></div><p class="error" id="error" role="alert"></p><button class="submit" id="submit">Entrar →</button></form><footer>Acesso restrito a usuários autorizados.</footer></main><script>
const form=document.getElementById('login'),pass=document.getElementById('password'),toggle=document.getElementById('toggle'),submit=document.getElementById('submit'),error=document.getElementById('error');toggle.addEventListener('click',()=>{const show=pass.type==='password';pass.type=show?'text':'password';toggle.textContent=show?'Ocultar':'Mostrar';toggle.setAttribute('aria-pressed',show);});form.addEventListener('submit',async event=>{event.preventDefault();submit.disabled=true;submit.textContent='Entrando…';error.textContent='';try{const response=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:form.username.value.trim(),password:pass.value})});const data=await response.json();if(!response.ok)throw Error(data.error||'Não foi possível entrar.');location.replace('/');}catch(e){error.textContent=e.message||'Falha de conexão. Tente novamente.';submit.disabled=false;submit.textContent='Entrar →';}});
</script></body></html>
